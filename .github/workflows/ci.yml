# Сборка и все тесты на каждый PR и на каждый push в main.
# Testcontainers поднимает настоящий Postgres 18 в Docker (на раннерах GitHub Docker есть).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый push в ту же ветку отменяет ещё идущую проверку старого коммита
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка и тесты
        run: ./mvnw -B verify

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
