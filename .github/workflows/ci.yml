# Сборка и все тесты на каждый PR и на каждый push в main.
# Testcontainers поднимает настоящий Postgres 18 в Docker (на раннерах GitHub Docker есть).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый push в ту же ветку отменяет ещё идущую проверку старого коммита
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка и тесты
        run: ./mvnw -B verify

      # Логика Mini App без браузера: node:test встроен в Node, npm install не нужен
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Тесты Mini App (JS)
        run: node --test 'src/test/js/*.test.js'

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # Весь прод-стек из compose.prod.yaml с настоящими Dockerfile: образы собираются,
  # nginx отдаёт приложение по https, служебные адреса закрыты, бэкап восстанавливается.
  # DENTAL_DOMAIN=localhost: certbot не ходит в Let's Encrypt, nginx на временном сертификате
  prod-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f compose.prod.yaml --env-file .env
      BACKUP_DIR: /tmp/dental-backups
    steps:
      - uses: actions/checkout@v5

      - name: Прод-стек
        run: |
          cat > .env <<'ENV'
          DENTAL_DOMAIN=localhost
          POSTGRES_PASSWORD=ci-db-password
          TELEGRAM_BOT_TOKEN=123456:ci-token
          TELEGRAM_WEBHOOK_SECRET=ci-webhook-secret
          TELEGRAM_MODE=off
          ALLOWED_TELEGRAM_IDS=111
          CLINIC_CONTACT=+996 555 000 000
          ENV
          $COMPOSE up -d --build
          for _ in $(seq 1 90); do
            if curl -kfs https://localhost/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -kfs https://localhost/actuator/health | grep '"UP"'

      - name: Mini App, вход, webhook, закрытые адреса
        run: |
          code() { curl -ks -o /dev/null -w '%{http_code}' "$@"; }
          curl -kfs https://localhost/ | grep -q '<title>Запись</title>'
          test "$(code https://localhost/js/app.js)" = 200
          test "$(code 'https://localhost/api/appointments?date=2026-10-23')" = 401
          test "$(code -X POST -H 'Content-Type: application/json' -d '{}' https://localhost/telegram/webhook)" = 401
          test "$(code -X POST -H 'X-Telegram-Bot-Api-Secret-Token: ci-webhook-secret' -H 'Content-Type: application/json' -d '{"update_id":1}' https://localhost/telegram/webhook)" = 200
          test "$(code https://localhost/dev/init-data)" = 404
          test "$(code https://localhost/actuator/prometheus)" = 404
          curl -sI http://localhost/ | grep -qi '^location: https://'
          # Приложение работает не от root
          test "$($COMPOSE exec -T app id -u)" != "0"

      - name: Заголовки безопасности
        run: |
          headers="$(curl -ks -D - -o /dev/null https://localhost/)"
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          # Фрейм разрешён только Telegram Web — иначе Mini App там не откроется
          echo "$headers" | grep -qi '^content-security-policy: frame-ancestors https://web.telegram.org'
          if echo "$headers" | grep -qi '^x-frame-options:'; then echo "X-Frame-Options сломает Telegram Web"; exit 1; fi
          if echo "$headers" | grep -i '^server:' | grep -q '[0-9]'; then echo "nginx показывает версию"; exit 1; fi

      - name: Приложение остановлено — 503 «обновляется», а не голый 502
        run: |
          $COMPOSE stop app
          test "$(curl -ks -o /dev/null -w '%{http_code}' 'https://localhost/api/appointments?date=2026-10-23')" = 503
          curl -ks 'https://localhost/api/appointments?date=2026-10-23' | jq -e '.detail | test("обновляется")'
          $COMPOSE start app

      - name: Бэкап и проверка восстановления
        run: |
          $COMPOSE exec -T db psql -U dental -d dental -c \
            "insert into patient (full_name, phone) values ('Тест', '996555000000')"
          deploy/backup.sh
          test "$(stat -c %a "$BACKUP_DIR"/db-*.dump)" = 600
          deploy/verify-backup.sh | tee /tmp/verify.log
          grep -q 'пациентов: 1' /tmp/verify.log

      - name: Логи
        if: always()
        run: $COMPOSE logs --no-color --tail 100 || true

  # Браузерные тесты Mini App (e2e/): Chromium открывает приложение «внутри Telegram» —
  # заглушка Telegram.WebApp с подписанной initData — против настоящего бэкенда и Postgres
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dental
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: dental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental -d dental"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_BOT_TOKEN: '123456:e2e-token'
      E2E_USER_ID: '111'
      DATABASE_URL: postgres://dental:dental@localhost:5432/dental
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка приложения
        run: ./mvnw -B -q -DskipTests package

      - name: Запуск приложения
        run: |
          java -jar target/dental-*.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -fs localhost:8080/actuator/health | grep '"UP"'
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dental
          SPRING_DATASOURCE_USERNAME: dental
          SPRING_DATASOURCE_PASSWORD: dental
          TELEGRAM_BOT_TOKEN: ${{ env.E2E_BOT_TOKEN }}
          ALLOWED_TELEGRAM_IDS: ${{ env.E2E_USER_ID }}
          TELEGRAM_MODE: 'off'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Браузерные тесты
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Отчёт Playwright (трассы и снимки упавших тестов)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Лог приложения
        if: always()
        run: tail -n 200 app.log || true
