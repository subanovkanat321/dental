# Заголовки безопасности. Отдельным файлом: если в location есть свой add_header,
# заголовки сервера туда не наследуются — их нужно подключить заново.

add_header Strict-Transport-Security "max-age=31536000" always;
# Не X-Frame-Options DENY, как в store: Telegram Web (web.telegram.org) показывает Mini App
# во фрейме, и DENY сломал бы её там. Разрешаем фрейм только с web.telegram.org
add_header Content-Security-Policy "frame-ancestors https://web.telegram.org" always;
add_header X-Content-Type-Options "nosniff" always;
# Адрес нашей страницы не уходит на чужие сайты (wa.me, telegram.org)
add_header Referrer-Policy "no-referrer" always;
