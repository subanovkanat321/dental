# Профиль local — ноутбук. Включается сам при ./mvnw spring-boot:run (pom.xml).
#
# База — Postgres 18 из compose.yaml: Spring Boot (spring-boot-docker-compose) поднимает
# контейнер при старте. Подключиться из DBeaver / IntelliJ: localhost:5433, база dental,
# логин и пароль dental. Порт 5433, а не 5432: на 5432 живёт база магазина (store).
# Начать с чистой базы: docker compose down -v.

spring:
  # Секреты для ноутбука — в .env рядом с pom.xml (он в .gitignore), формат KEY=value, UTF-8.
  # Шаблон — .env.example. Читает DotEnvEnvironmentPostProcessor. Файла нет — запуск без бота
  docker:
    compose:
      # Не останавливать базу вместе с приложением
      lifecycle-management: start-only

dental:
  telegram:
    # Без .env Mini App всё равно открывается в браузере: initData подписывает
    # DevInitDataController этим токеном за пользователя 1. Бот при этом выключен (mode off)
    bot-token: ${TELEGRAM_BOT_TOKEN:local-dev-token}
    allowed-ids: ${ALLOWED_TELEGRAM_IDS:1}

logging:
  level:
    kg.dental: debug
    org.hibernate.SQL: debug
