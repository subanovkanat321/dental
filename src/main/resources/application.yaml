# Общие настройки для всех окружений. Отличия — в профилях (spring.profiles.active):
#   local — ноутбук: application-local.yaml (./mvnw spring-boot:run включает его сам);
#   prod  — сервер: application-prod.yaml (SPRING_PROFILES_ACTIVE=prod).
# Секреты (токен бота, пароль базы) — только переменными окружения, ни в одном из этих файлов.

server:
  # На SIGTERM дописать начатые запросы и только потом выйти
  shutdown: graceful

spring:
  application:
    name: dental
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт только Flyway, Hibernate лишь сверяет с ней сущности
      ddl-auto: validate

dental:
  # Время приёмов в базе — UTC (timestamptz), врачу и пациентам показываем по Бишкеку
  time-zone: Asia/Bishkek
  telegram:
    # Секреты — только переменными окружения (на ноутбуке — файл .env, см. .env.example)
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    # Telegram id врача (и ассистента) через запятую. Свой id подскажет @userinfobot
    allowed-ids: ${ALLOWED_TELEGRAM_IDS:}
    # off | polling | webhook. Без явного выбора бот молчит
    mode: ${TELEGRAM_MODE:off}
    # https-адрес приложения: webhook и кнопка Mini App
    public-url: ${PUBLIC_URL:}
    # Ответ посторонним: как записаться (телефон регистратуры — не пациента)
    clinic-contact: ${CLINIC_CONTACT:}
    init-data-max-age: 24h

management:
  endpoints:
    web:
      exposure:
        include: health
