# Общие настройки для всех окружений. Отличия — в профилях (spring.profiles.active):
#   local — ноутбук: application-local.yaml (./mvnw spring-boot:run включает его сам);
#   prod  — сервер: application-prod.yaml (SPRING_PROFILES_ACTIVE=prod).
# Секреты (токен бота, пароль базы) — только переменными окружения, ни в одном из этих файлов.

server:
  # На SIGTERM дописать начатые запросы и только потом выйти
  shutdown: graceful

spring:
  application:
    name: dental
  # Тексты бота для пациента: messages.properties (ru) и messages_ky.properties.
  # Без перевода ключа — русский, а не язык сервера
  messages:
    basename: messages
    fallback-to-system-locale: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      cache:
        # Mini App (index.html, app.js, app.css): браузер Telegram каждый раз сверяет файлы
        # с сервером (ответ 304, если не менялись). Без заголовка он кэширует на своё усмотрение
        # и после обновления сервера долго показывал бы старую версию
        cachecontrol:
          no-cache: true
  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт только Flyway, Hibernate лишь сверяет с ней сущности
      ddl-auto: validate

dental:
  # Время приёмов в базе — UTC (timestamptz), врачу и пациентам показываем по Бишкеку
  time-zone: Asia/Bishkek
  # Рабочие часы и дни (по Бишкеку): внутри них Mini App показывает «свободно» и сетку
  # времени. Записать вне их можно — через «Другое время». Обед и разные часы по дням — не в v1
  work-hours: ${WORK_HOURS:09:00-18:00}
  work-days: ${WORK_DAYS:MON-SUN}
  # Самозапись пациентов через бота (PATIENT_BOOKING=false — выключить)
  booking:
    enabled: ${PATIENT_BOOKING:true}
    min-lead: 2h
    days-ahead: 30
  # Когда бот пишет врачу (по Бишкеку). before-minutes: 0 — не предупреждать перед приёмом
  notify:
    morning-time: ${MORNING_DIGEST_TIME:09:00}
    evening-time: ${EVENING_DIGEST_TIME:18:30}
    before-minutes: ${NOTIFY_BEFORE_MINUTES:15}
    # Бот сам напоминает о завтрашнем приёме тем, кто записался через бота
    patient-reminder-time: ${PATIENT_REMINDER_TIME:18:00}
    patient-reminders: ${AUTO_REMIND_PATIENTS:true}
    # На следующий день после приёма бот спрашивает оценку (1–5) у записавшихся через бота
    review-time: ${REVIEW_TIME:12:00}
    reviews: ${ASK_REVIEWS:true}
  # Подпись в конце напоминания в WhatsApp, например «Стоматология «Улыбка», 0555 000 000»
  clinic-signature: ${CLINIC_SIGNATURE:}
  telegram:
    # Секреты — только переменными окружения (на ноутбуке — файл .env, см. .env.example)
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    # Telegram id врача (и ассистента) через запятую. Свой id подскажет @userinfobot
    allowed-ids: ${ALLOWED_TELEGRAM_IDS:}
    # off | polling | webhook. Без явного выбора бот молчит
    mode: ${TELEGRAM_MODE:off}
    # https-адрес приложения: webhook и кнопка Mini App
    public-url: ${PUBLIC_URL:}
    # Ответ посторонним: как записаться (телефон регистратуры — не пациента)
    clinic-contact: ${CLINIC_CONTACT:}
    init-data-max-age: 24h

management:
  endpoints:
    web:
      exposure:
        include: health
